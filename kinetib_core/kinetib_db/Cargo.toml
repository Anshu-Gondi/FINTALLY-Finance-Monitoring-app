[package]
name = "kinetib_db"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "json", "uuid", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dotenvy = "0.15"
kinetib_recurrence = { path = "../kinetib_recurrence" }
kinetib_feedback_domain = { path = "../kinetib_feedback_domain" }
sha2 = "0.10"
