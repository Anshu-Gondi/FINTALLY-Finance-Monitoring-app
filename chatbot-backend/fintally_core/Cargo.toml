[workspace]
resolver = "2"
members = [
    "rust_backend",
    "fintally_finance",
    "fintally_chatbot",
]

[workspace.dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310", "serde"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
once_cell = "1.19"

thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

async-trait = "0.1"
futures-util = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"

signal-hook = "0.3"

# ✨ Centralized RAG performance dependencies for your crates
regex = "1.10"
fxhash = "0.2.1"
usearch = "2.25"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 16
panic         = "abort"
strip         = true

[profile.dev]
incremental = true