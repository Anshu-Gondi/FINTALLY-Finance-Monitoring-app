[workspace]
resolver = "2"
members = [
    "analytics_engine",
    "fintally_finance",
    "fintally_chatbot",
    "fintally_db", 
    "fintally_axum",
]

[workspace.dependencies]
candle-core         = "0.11.0"
candle-nn           = "0.11.0"
candle-transformers = "0.11.0"
memmap2             = "0.9.0"
tokenizers          = "0.22.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
once_cell = "1.19"

thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

async-stream = "0.1"
async-trait = "0.1"
futures-util = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"

signal-hook = "0.3"

# ✨ Centralized RAG performance dependencies for your crates
regex = "1.10"
fxhash = "0.2.1"
usearch = "2.25"

[profile.release]
opt-level = 3
lto = "fat"          
codegen-units = 16    
panic = "abort"      
strip = true         

[profile.dev]
incremental = true
opt-level = 0        