# fintally_core/rust_backend/Cargo.toml
[package]
name    = "rust_backend"
version = "0.1.0"
edition = "2021"

[lib]
name       = "rust_backend"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
rand       = "0.8"
rand_distr = "0.4"
bson       = "2.11"
futures    = "0.3"