[package]
name = "fintally_axum"
version = "0.1.0"
edition = "2021"

[dependencies]
# Local workspace dependency
fintally_db = { path = "../fintally_db" }
fintally_finance = { path = "../fintally_finance" }

# Lean web stack
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
axum-extra = { version = "0.9", features = ["typed-header"] }
bcrypt = "0.15"
google-jwt-signin = { version = "0.4", features = ["async"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "json", "uuid",] }
uuid = { version = "1.0", features = ["v4", "serde"] }
genpdf = "0.2"
chrono = { version = "0.4", features = ["serde"] }
