# fintally_chatbot/pyproject.toml
[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name        = "fintally-chatbot"
version     = "0.1.0"
description = "LLM chatbot extension for FinTally"
requires-python = ">=3.10"

[tool.maturin]
module-name   = "fintally_chatbot"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require python_llama and real model files",
]

# Run integration tests one at a time — llama.cpp is not thread-safe
addopts = "-p no:randomly"