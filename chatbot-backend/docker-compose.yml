services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_NO_AVX: ${LLAMA_NO_AVX:-0}
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./llm_models:/app/llm_models
      - ./uploads:/app/uploads
    
    restart: unless-stopped
    
    # Better healthcheck (using the /health endpoint you added)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s        # Extra time for LLM warm-up

    # Resource limits (works with regular docker compose)
    mem_limit: 4g
    cpus: "2.0"