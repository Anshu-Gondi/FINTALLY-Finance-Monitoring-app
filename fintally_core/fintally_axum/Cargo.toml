[package]
name = "fintally_axum"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
# Local workspace dependency
fintally_db = { path = "../fintally_db" }
fintally_finance = { path = "../fintally_finance" }
analytics_engine = { path = "../analytics_engine" }
fintally_chatbot = { path = "../fintally_chatbot" }

# Lean web stack
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
futures-util = "0.3"
serde_json = "1.0"
jsonwebtoken = "9.3"
axum-extra = { version = "0.9", features = ["typed-header", "query"] }
bcrypt = "0.15"
google-jwt-signin = { version = "0.4", features = ["async"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "json", "uuid", "time"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
genpdf = "0.2"
chrono = { version = "0.4", features = ["serde"] }
tracing.workspace = true
async-stream       = { workspace = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.23.1"
