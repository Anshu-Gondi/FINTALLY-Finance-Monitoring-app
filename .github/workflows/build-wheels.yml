name: Build PyO3 Wheels

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  build-wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux

          - os: windows-latest
            target: windows

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: chatbot-backend/fintally_core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: pip install maturin

      # ─────────────────────────────
      # Build all workspace crates
      # ─────────────────────────────

      - name: Build rust_backend wheel
        run: maturin build -m rust_backend/Cargo.toml --release

      - name: Build fintally_chatbot wheel
        run: maturin build -m fintally_chatbot/Cargo.toml --release

      - name: Build fintally_finance wheel
        run: maturin build -m fintally_finance/Cargo.toml --release

      # ─────────────────────────────
      # Upload wheels
      # ─────────────────────────────

      - name: Upload rust_backend wheel
        uses: actions/upload-artifact@v4
        with:
          name: rust_backend-${{ matrix.target }}
          path: chatbot-backend/fintally_core/target/wheels/*.whl

      - name: Upload fintally_chatbot wheel
        uses: actions/upload-artifact@v4
        with:
          name: fintally_chatbot-${{ matrix.target }}
          path: chatbot-backend/fintally_core/target/wheels/*.whl

      - name: Upload fintally_finance wheel
        uses: actions/upload-artifact@v4
        with:
          name: fintally_finance-${{ matrix.target }}
          path: chatbot-backend/fintally_core/target/wheels/*.whl