name: Build PyO3 Wheels

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - dev

jobs:
  build-wheels:
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            target: linux

          - os: windows-latest
            target: windows

    runs-on: ${{ matrix.os }}

    env:
      CARGO_TERM_COLOR: always

    defaults:
      run:
        working-directory: chatbot-backend/fintally_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: pip install maturin

      - name: Cargo check workspace
        run: cargo check --workspace

      # ─────────────────────────────
      # Build wheels
      # ─────────────────────────────

      - name: Build rust_backend wheel
        run: maturin build --manifest-path rust_backend/Cargo.toml --release

      - name: Build fintally_chatbot wheel
        run: maturin build --manifest-path fintally_chatbot/Cargo.toml --release

      - name: Build fintally_finance wheel
        run: maturin build --manifest-path fintally_finance/Cargo.toml --release

      # ─────────────────────────────
      # Upload wheels
      # ─────────────────────────────

      - name: Upload rust_backend wheel
        uses: actions/upload-artifact@v4
        with:
          name: rust_backend-${{ matrix.target }}
          path: chatbot-backend/fintally_core/target/wheels/*.whl

      - name: Upload fintally_chatbot wheel
        uses: actions/upload-artifact@v4
        with:
          name: fintally_chatbot-${{ matrix.target }}
          path: chatbot-backend/fintally_core/target/wheels/*.whl

      - name: Upload fintally_finance wheel
        uses: actions/upload-artifact@v4
        with:
          name: fintally_finance-${{ matrix.target }}
          path: chatbot-backend/fintally_core/target/wheels/*.whl