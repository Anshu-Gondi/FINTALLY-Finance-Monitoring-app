name: rust_backend Tests

on:
  push:
    branches: [main, dev]

  pull_request:

jobs:
  test-rust-backend:
    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # IMPORTANT:
        # use workspace root, not crate root
        working-directory: chatbot-backend/fintally_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies
        run: |
          pip install maturin
          pip install pytest

      - name: Build PyO3 extension
        run: |
          maturin develop \
            -m rust_backend/Cargo.toml \
            --release

      - name: Run tests
        run: |
          pytest rust_backend/tests -v