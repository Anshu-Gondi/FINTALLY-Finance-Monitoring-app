name: Production Multi-Stage Core Image Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-cuda:
    name: Build CUDA (${{ matrix.gpu_tier }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # NVIDIA T4 (GCP Starter - Turing Architecture)
          - gpu_tier: "t4"
            cuda_cap: "75"
            tag_suffix: "-t4"

          # NVIDIA A10G / A100 / RTX 30xx (Ampere Architecture)
          - gpu_tier: "ampere"
            cuda_cap: "86"
            tag_suffix: "-ampere"

          # NVIDIA L4 / L40 / RTX 40xx (Ada Lovelace Architecture)
          - gpu_tier: "ada"
            cuda_cap: "89"
            tag_suffix: "-ada"

          # NVIDIA H100 (Hopper Architecture)
          - gpu_tier: "hopper"
            cuda_cap: "90"
            tag_suffix: "-hopper"

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      # 🧹 AGGRESSIVE DISK CLEANUP: Reclaims ~40GB on the root partition (/)
      - name: Free Up Runner Disk Space
        run: |
          echo "=== Space before cleanup ==="
          df -h

          # Remove heavy pre-installed packages & frameworks from root partition
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force

          echo "=== Space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata Configurations
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=sha,prefix=sha-,format=short,suffix=${{ matrix.tag_suffix }}
            type=raw,value=latest${{ matrix.tag_suffix }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Container Image (${{ matrix.gpu_tier }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./fintally_core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.gpu_tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.gpu_tier }}
          build-args: |
            CUDA_COMPUTE_CAP=${{ matrix.cuda_cap }}
