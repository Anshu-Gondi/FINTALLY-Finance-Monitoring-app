name: Production Multi-Stage Core Image Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-secure-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      # 🧠 DISK & DOCKER OPTIMIZATION:
      # 1. Wipes out ~30GB+ of pre-installed software frameworks.
      # 2. Configures Docker to use the massive workspace volume for its layers and temp images.
      # 3. Restarts the daemon to safely apply the changes before Buildx spins up.
      - name: Free Disk Space & Redirect Docker Storage
        run: |
          echo "=== Space before cleanup ==="
          df -h
          
          # Remove heavy frameworks you don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          
          # Create dedicated space on the spacious runner workspace partition
          sudo mkdir -p /home/runner/work/_temp/docker_root
          
          # Point Docker's root to the new directory
          echo '{"data-root": "/home/runner/work/_temp/docker_root"}' | sudo tee /etc/docker/daemon.json
          
          # Restart Docker service to pick up the new path
          sudo systemctl restart docker
          
          echo "=== Space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata Configurations
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build, Bake and Push Protected Production Docker Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./fintally_core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max