name: Production Multi-Stage Core Image Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-secure-export:
    runs-on: ubuntu-latest

    steps:
      # 🚀 MAXIMIZE DISK SPACE: Reclaims pre-allocated disk partitions to provide ~75GB+ free space
      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@v5
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata Configurations
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build, Bake and Push Protected Production Docker Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./fintally_core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # 💡 Optimization: 'mode=min' caches only the final resulting image layers,
          # preventing giant intermediate CUDA/Rust build layers from filling the runner disk.
          cache-to: type=gha,mode=min
          build-args: |
            CUDA_COMPUTE_CAP=89
