name: Lint

on:
  push:
  pull_request:

jobs:

  # ─────────────────────────────────────────
  # Rust
  # ─────────────────────────────────────────
  lint-rust:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatbot-backend/fintally_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings


  # ─────────────────────────────────────────
  # Python
  # ─────────────────────────────────────────
  lint-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      # IMPORTANT:
      # Do NOT install llama-cpp-python here.
      # Linting should stay lightweight.
      - name: Run Ruff
        run: ruff check chatbot-backend


  # ─────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────
  lint-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint