name: fintally_finance Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test-finance:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: chatbot-backend/fintally_core/fintally_finance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          pip install maturin
          pip install pytest

      - name: Build extension
        run: maturin develop --release

      - name: Run tests
        run: pytest tests -v