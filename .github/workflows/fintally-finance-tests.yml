name: fintally_finance Tests

on:
  push:
    branches: [main, dev]

  pull_request:

jobs:
  test-finance:
    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    env:
      CARGO_TERM_COLOR: always

    defaults:
      run:
        # IMPORTANT:
        # use workspace root, not crate root
        working-directory: chatbot-backend/fintally_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies
        run: |
          pip install maturin
          pip install pytest

      - name: Cargo check
        run: cargo check --workspace

      - name: Build wheel
        run: maturin build -m fintally_finance/Cargo.toml --release

      - name: Install built wheel
        shell: bash
        run: |
          pip install target/wheels/fintally_finance*.whl

      - name: Run tests
        run: pytest fintally_finance/tests -v